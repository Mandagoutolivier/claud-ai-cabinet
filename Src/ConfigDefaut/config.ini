; ============================================================
; Configuration du logiciel de cabinet - fichier UTF-8
; Modifiable avec le Bloc-notes. Lignes ; ou # = commentaires.
; ============================================================

[GENERAL]
NomCabinet=Cabinet de cardiologie
Ville=Beaumont-sur-Oise

[MEDECIN]
; Coordonnees utilisees pour l'en-tete des courriers et la feuille de soins
Titre=Docteur
Prenom=Olivier
Nom=MANDAGOUT
Specialite=Maladies cardio-vasculaires
SousTitre=Ancien interne des Hôpitaux de Paris
AdresseLigne1=10, rue de la Libération
AdresseLigne2=95260 Beaumont-sur-Oise
Telephone=01 34 70 21 02
; RPPS et numero AM : a completer pour la feuille de soins
RPPS=
NumeroAM=
; Bloc signature en bas des courriers (| = saut de ligne)
Signature=Docteur Olivier MANDAGOUT

[API]
; Fournisseur de l'IA : claude (defaut) ou openai
;   claude : cle dans %APPDATA%\CabinetCardio\api.key (poste du medecin), modele = Modele
;   openai : cle dans la variable d'environnement OPENAI_API_KEY (ou
;            %APPDATA%\CabinetCardio\openai.key), modele = ModeleOpenAI (Responses API)
; Dans les deux cas, seul le texte ANONYMISE part vers l'API.
Fournisseur=claude
ModeleOpenAI=gpt-4.1
; WorkspaceId : requis si la cle Claude est "liee a une identite" (id wrkspc_...)
WorkspaceId=
Modele=claude-sonnet-5
MaxTokens=8000
TimeoutReceptionMs=120000
; Debug=1 : ecrit le contenu exact envoye a l'API dans Logs\payload_debug.json
; (a n'utiliser qu'avec des patients FICTIFS)
Debug=1

[COURRIER]
; Espacement des paragraphes du corps (releve sur les courriers du cabinet)
EspaceAvantPt=12
EspaceApresPt=0
Interligne=1.15
; Formules par defaut quand la fiche correspondant n'en precise pas :
; correspondant proche (tutoye) / autre confrere
AppelProche=Cher Ami,
AppelDefaut=Cher Confrère,
PolitesseProche=Bien cordialement.
PolitesseDefaut=Bien confraternellement.

[DERIVEES]
; Types de demandes proposes par "Lettre derivee" (codes, separes par ;) :
;   TE=epreuve d'effort, SCINTI=scintigraphie myocardique, SCANCORO=scanner
;   coronaire / score calcique, IRM=IRM cardiaque, AVIS=avis specialise,
;   HOSP=demande d'hospitalisation. Les echos, Holter et MAPA sont faits au
;   cabinet : pas de courrier derive.
Types=TE;SCINTI;SCANCORO;IRM;AVIS;HOSP
; Classeur des correspondants specialistes (destinataire pre-rempli par type
; d'examen) : chemin relatif a la racine, ou absolu. Feuilles lues :
; Specialistes (fiches, adresses) et Specialistes_ParType (type d'examen,
; priorite, formules). Absent = liste generale des correspondants.
FichierSpecialistes=Base\Correspondants_Specialistes.xlsx
FeuilleSpecialistes=Specialistes
FeuilleParType=Specialistes_ParType

[ECG]
; Envoi de l'identite patient a Resting12Lead par fichier GDT.
; DossierGdt : dossier surveille par l'ECG (Interface GDT In) -
;   C:\Mandagout si l'ECG tourne sur ce poste, ou un partage reseau
;   (ex : \\POSTE-ECG\Mandagout). Vide = fonction desactivee.
; Cote Resting12Lead : Parametres > Parametres Interface >
;   Saisie Auto info Patient = GDT (Connection Systeme Info DMS DEcochee).
DossierGdt=C:\Mandagout
CodeExamen=EKG01

[AGENDA]
; Vue hebdomadaire : plage horaire, pas des creneaux (minutes), jours affiches (lundi=1er)
HeureDebut=08:00
HeureFin=19:00
PasMinutes=15
Jours=5
; Valeurs proposees par defaut a la prise de rendez-vous
DureeDefautMin=15
ActeDefaut=APC

[ECHANGE]
; Frequence de verification des courriers valides (poste secretaire)
ScrutationSecondes=30

[CERFA]
; Decalage global d'impression en millimetres (macro de calage)
OffsetX_mm=0
OffsetY_mm=0
Imprimante=
