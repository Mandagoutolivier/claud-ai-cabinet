; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Style reel (12 lettres au pneumologue) : "Merci de prendre en charge Monsieur X. Y., 72 ans, qui présente une hypertension artérielle
; avec perte complète du rythme circadien." + 1 ou 2 lignes (symptomes SAOS, traitement) + "Merci de faire la part d'un syndrome d'apnée du sommeil."
; Le mot "polygraphie" n'est jamais ecrit.

[IDENTITE]
CODE=RECHERCHE_SAOS
LIBELLE=recherche de syndrome d'apnée du sommeil
ARTICLE=une
NATURE=CONSULTATION
TYPE_BASE=SAOS,AVIS_PNEUMOLOGIE
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de prendre en charge {PATIENT}{AGE_SEGMENT}, qui présente {MOTIF}.
; Variantes reelles : "qui se plaint de réveils nocturnes accompagnés de poussées hypertensives" / "qui décrit, dans un contexte de nycturie, une hypersomnie assez importante"
; / "en surcharge pondérale, qui présente une bronchopathie sévère" / "qui résiste à une pentathérapie anti-hypertensive associant ..."

[MOTIF]
DEFAUT=une hypertension artérielle avec perte du rythme circadien

[STRUCTURE]
ORDRE=SYMPTOMES_SAOS;TRAITEMENTS;CONTEXTE_CARDIOLOGIQUE;OBJECTIF
OBLIGATOIRE=SYMPTOMES_SAOS;OBJECTIF
OBLIGATOIRE_SI_PRESENT=TRAITEMENTS
OPTIONNEL=CONTEXTE_CARDIOLOGIQUE
INTERDIT=EXAMEN_CLINIQUE;ECG;ECHOGRAPHIE_DETAILLEE;POIDS_IMC_PERIMETRE_CERVICAL;CONCLUSION_AU_TOTAL

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=4

[OBJECTIF]
MODELE=Merci de faire la part d'un syndrome d'apnée du sommeil.
; Variantes reelles : "Merci de l'explorer." / "Merci de vérifier l'absence de syndrome d'apnée du sommeil."
; / "Merci de vérifier l'absence de syndrome d'apnée du sommeil sachant qu'une exploration avait déjà été réalisée il y a quelques années, négative."
; Pas de phrase de courtoisie supplementaire.

[PREFIXES]
SYMPTOMES_SAOS=On retrouve une notion de
TRAITEMENTS=Traitement actuel
CONTEXTE_CARDIOLOGIQUE=Ce jour, le bilan cardiovasculaire est

[SELECTION]
SYMPTOMES_SAOS=ronchopathie;ronflement;hypersomnie;nycturie;asthenie;endormissement;reveils nocturnes;apnees
TRAITEMENTS=traitement;antihypertenseur;equilibre par;traite par;resiste a
CONTEXTE_CARDIOLOGIQUE=rythme circadien;holter tensionnel;mapa;fibrillation auriculaire;hypertension;coronarien;echographie cardiaque

[INSTRUCTIONS]
SYMPTOMES_SAOS=Une ligne : ronchopathie, hypersomnie diurne, nycturie, asthenie, tels que decrits ; signaler aussi une absence ("On ne retrouve pas de notion de ronchopathie."). Pas d'interlocuteur direct.
TRAITEMENTS=Une ligne, medicaments en majuscules sans virgules, uniquement le traitement antihypertenseur ou rythmique.
CONTEXTE_CARDIOLOGIQUE=Une ligne au plus : profil tensionnel de la MAPA (perte du rythme circadien, HTA resistante), arythmie ou bilan cardiovasculaire normal ; un antecedent non cardiologique majeur s'il pese sur l'exploration (epilepsie, bronchopathie).
OBJECTIF=Demande directe "Merci de ..." ; ajouter "sachant que ..." pour une exploration anterieure ou une comorbidite utile au pneumologue.

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
