; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Calibrage : lettre reelle PATIENT_001343 (IRM cerebrale, recherche d'un nouvel accident ischemique).

[IDENTITE]
CODE=IRM_CEREBRALE
LIBELLE=IRM cérébrale
ARTICLE=une
NATURE=EXAMEN
TYPE_BASE=IRM
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.

[MOTIF]
DEFAUT=aux antécédents exposés ci-dessous

[STRUCTURE]
ORDRE=CONTEXTE;ANAMNESE;TRAITEMENTS;QUESTION
OBLIGATOIRE=CONTEXTE;QUESTION
OBLIGATOIRE_SI_PRESENT=ANAMNESE;TRAITEMENTS
OPTIONNEL=
INTERDIT=EXAMEN_CLINIQUE;ECG;ECHOGRAPHIE;HOLTER;CONCLUSION

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=4

[OBJECTIF]
MODELE=Merci de déterminer s'il existe un nouvel accident ischémique.

[PREFIXES]
CONTEXTE=aux antécédents de
ANAMNESE=Elle a présenté
TRAITEMENTS=Elle poursuit l'association
QUESTION=Merci de déterminer

[SELECTION]
CONTEXTE=accident ischemique;ait;avc;sequelle;fibrillation;stenose carotidienne;hypertendu
ANAMNESE=dysesthesie;deficit;hemicorps;aphasie;vertige;trouble visuel;duree;resolutif;consulte
TRAITEMENTS=aspirine;anticoagulant;statine;poursuit;association
QUESTION=nouvel accident;ischemique;lesion;sequelle

[INSTRUCTIONS]
CONTEXTE=Une seule phrase accrochée à l'identité : antécédent neurologique daté et ses séquelles (« aux antécédents d'accident ischémique cérébral transitoire en 2009 sans séquelle »).
ANAMNESE=Une phrase : l'épisode récent qui motive l'examen, avec sa date, sa durée et son évolution (« Elle a présenté l'année dernière ... ayant duré 24 heures spontanément résolutive »).
TRAITEMENTS=Une ligne : « Elle poursuit l'association A B C. », médicaments en majuscules, sans posologie.
QUESTION=Dernière ligne, question directe : « Merci de déterminer s'il existe un nouvel accident ischémique. »

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
