; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Cles informatives NON lues par le logiciel : DESTINATION_MODE, REGROUPEMENT, [REVISION_FINALE], FORME, UNE_PHRASE_PAR_LIGNE, MEDICAMENTS, TELEGRAPHIQUE_TRAITEMENT
; Profil aligne sur les lettres reelles du Dr Mandagout (ex. PATIENT_001905) : 5 lignes, une phrase par ligne.

[IDENTITE]
CODE=TEST_EFFORT
LIBELLE=test d'effort
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=TEST_EFFORT
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.

[MOTIF]
DEFAUT=
EXEMPLES=ayant de bons facteurs de risque cardiovasculaire et notamment dyslipidémie, diabète de type 2, hypertension artérielle, traité par JANUMET COVERAM GLUCOPHAGE DIAMICRON INEGY;présentant des douleurs thoraciques atypiques;dans le cadre d'une reprise d'activité sportive

[STRUCTURE]
ORDRE=ANAMNESE;CONSIGNE_MEDICAMENTEUSE;EXAMEN_CLINIQUE;ECG
OBLIGATOIRE=EXAMEN_CLINIQUE;ECG
OBLIGATOIRE_SI_PRESENT=ANAMNESE;CONSIGNE_MEDICAMENTEUSE
OPTIONNEL=
INTERDIT=ECHOGRAPHIE;EXAMENS_ANTERIEURS;BIOLOGIE;CONCLUSION

[STYLE]
LONGUEUR=MOYENNE
PARAGRAPHES_MAX=6
UNE_PHRASE_PAR_LIGNE=OUI
MEDICAMENTS=MAJUSCULES_SANS_VIRGULE

[OBJECTIF]
MODELE=Merci de confirmer l'absence de coronaropathie.
VARIANTES=Merci de confirmer l'absence d'ischémie myocardique.;Merci de confirmer l'absence de coronaropathie et de trouble du rythme d'effort.

[PREFIXES]
CONSIGNE_MEDICAMENTEUSE=Il arrêtera le
EXAMEN_CLINIQUE=L'examen clinique est
ECG=Sur le tracé en

[SELECTION]
MOTIF=facteurs de risque;hypertension arterielle;diabete;dyslipidemie;tabagisme;antecedents familiaux;traite par;douleur thoracique;dyspnee;palpitations;reprise sportive;asymptomatique
CONSIGNE_MEDICAMENTEUSE=betabloquant;bisoprolol;coveram;nebivolol;temerit;cardensiel;arreter;suspendre;48 heures avant;avant l examen
EXAMEN_CLINIQUE=examen clinique;normal;pression arterielle;souffle;auscultation
ECG=electrocardiogramme;ecg;trace;rythme sinusal;tachycardie sinusale;bradycardie;bloc incomplet droit;bloc;repolarisation;extrasystole;on note simplement
OBJECTIF=coronaropathie;ischemie;confirmer l absence

[INSTRUCTIONS]
MOTIF=Fusionner dans la premiere phrase les facteurs de risque puis le traitement, sous la forme 'ayant ... et notamment ..., traité par MEDICAMENT1 MEDICAMENT2' ; noms de medicaments en majuscules, juxtaposes sans virgule ; ne rien reprendre d'autre du courrier principal.
CONSIGNE_MEDICAMENTEUSE=Une seule ligne, uniquement si un betabloquant ou un traitement bradycardisant est en cours : 'Il arrêtera le X 48 heures avant l'examen.' Sinon omettre la ligne.
EXAMEN_CLINIQUE=Une seule ligne, tres courte : 'L'examen clinique est normal.' ou l'anomalie utile en une phrase.
ECG=Une seule ligne : 'Sur le tracé en [rythme], on note simplement [anomalie].' ou 'L'électrocardiogramme est normal.' si aucune anomalie.
OBJECTIF=Derniere ligne, imperative et courte, commencant par 'Merci de confirmer l'absence de' ; ne pas ecrire 'Cet examen permettra'.
ANAMNESE=Une ligne : « Il est asymptomatique. » ou le symptôme qui motive l'examen, tel que le courrier le formule.

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
