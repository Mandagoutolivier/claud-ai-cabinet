; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Style reel (5 lettres : genetique, diabetologie, gastro-enterologie, pneumologie) : "Merci de prendre en charge Monsieur X. Y., 49 ans,
; qui présente un syndrome de Brugada confirmé par un test à l'AJMALINE. Il est hypertendu traité par COTAREG. Merci de l'évaluer sur le plan génétique."

[IDENTITE]
CODE=AVIS_SPECIALISE
LIBELLE=avis spécialisé
ARTICLE=un
NATURE=CONSULTATION
TYPE_BASE=AVIS_SPECIALISE
DESTINATION_MODE=A_COMPLETER
REGROUPEMENT=JAMAIS

[PREMIER_PARAGRAPHE]
MODELE=Merci de prendre en charge {PATIENT}{AGE_SEGMENT}, {TERRAIN}qui présente {MOTIF}.
; {TERRAIN} = apposition facultative ("diabétique de type 2 hypertendu, ", "aux antécédents d'infarctus antéro-septal en 2006 traité par angioplastie, "), vide sinon.

[MOTIF]
DEFAUT=le problème décrit ci-dessous

[STRUCTURE]
ORDRE=ANAMNESE;TRAITEMENTS;BILAN_CARDIOLOGIQUE;QUESTION
OBLIGATOIRE=QUESTION
OBLIGATOIRE_SI_PRESENT=TRAITEMENTS
OPTIONNEL=ANAMNESE;BILAN_CARDIOLOGIQUE
INTERDIT=EXAMEN_CLINIQUE_DETAILLE;ECG_DETAILLE;ECHOGRAPHIE_DETAILLEE;BIOLOGIE;CONCLUSION_AU_TOTAL

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=4

[OBJECTIF]
MODELE=Merci de {PRONOM_OBJET} évaluer sur le plan {SPECIALITE}.
; Variantes reelles : "Merci de vérifier l'absence de part bronchique." / "Merci de prendre en charge l'ensemble de la pathologie, diabète et pied diabétique notamment."
; / "Merci de l'explorer." ; pas de phrase de courtoisie supplementaire.

[PREFIXES]
TRAITEMENTS=Son traitement associe
BILAN_CARDIOLOGIQUE=Sur le plan cardiovasculaire,

[SELECTION]
ANAMNESE=se plaint;signale;depuis;amaigrissement;dyspnee;constipation;douleur;evolutif
TRAITEMENTS=traitement;traite par;associe
BILAN_CARDIOLOGIQUE=bilan cardiovasculaire;fonction systolique;pressions intracardiaques;echographie;que je n'explique pas
QUESTION=evaluer;verifier;explorer;avis;prendre en charge;faire la part

[INSTRUCTIONS]
ANAMNESE=Une ligne sur le symptome ou le fait qui motive l'avis, tel que le courrier le formule. Pas d'interlocuteur direct.
TRAITEMENTS=Une ligne, medicaments en majuscules sans virgules ; mentionner une modification deja faite par le cardiologue si elle concerne le specialiste ("J'ai fait réduire le LEVOTHYROX à 150 en attendant que tu le voies.").
BILAN_CARDIOLOGIQUE=Une ligne au plus, seulement pour dire que le bilan cardiologique n'explique pas le symptome ou qu'il est normal.
QUESTION=Demande directe "Merci de ..." nommant ce qui est attendu du specialiste (evaluer, verifier l'absence de, prendre en charge l'ensemble de la pathologie).

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
