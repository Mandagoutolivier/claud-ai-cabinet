; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Cles informatives NON lues par le logiciel : DESTINATION_MODE, REGROUPEMENT, [REVISION_FINALE], FORME, UNE_PHRASE_PAR_LIGNE, MEDICAMENTS, TELEGRAPHIQUE_TRAITEMENT
; Etabli sur la lettre reelle PATIENT_000453 (anevrisme de l'aorte abdominale 48 mm en echo-doppler) : 3 lignes.

[IDENTITE]
CODE=ANGIOSCANNER_AORTE_MEMBRES_INFERIEURS
LIBELLE=angioscanner artériel de l'aorte abdominale et des membres inférieurs
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=ANGIOSCANNER_AORTE_MEMBRES_INFERIEURS
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.

[MOTIF]
DEFAUT=
; Relative accrochee au patient, avec la mesure echo-doppler : « qui présente un anévrisme de l'aorte abdominale de l'ordre de 48 mm en Echo-doppler »

[STRUCTURE]
ORDRE=TRAITEMENTS;OBJECTIF
OBLIGATOIRE=OBLIGATOIRE_SI_PRESENT=TRAITEMENTS
OPTIONNEL=OBJECTIF
INTERDIT=INDICATION;ANAMNESE;EXAMEN_CLINIQUE;ECG;ECHOGRAPHIE;HOLTER;MAPA;BIOLOGIE;IMAGERIE
OBLIGATOIRE_SI_PRESENT=

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=3

[OBJECTIF]
MODELE=Je lui demande de stopper la METFORMINE 48 heures avant l'examen.
; Uniquement si METFORMINE dans le traitement ; sinon aucune phrase finale (pas de courtoisie).

[PREFIXES]
TRAITEMENTS=Traitement habituel :

[SELECTION]
TRAITEMENTS=traitement;metformine;xarelto;eliquis;anticoagulant;allergie;creatinine
OBJECTIF=metformine;stopper

[INSTRUCTIONS]
TRAITEMENTS=Ligne télégraphique « Traitement habituel : » suivie des noms des médicaments en majuscules séparés par des espaces, sans posologie (examen injecté : anticoagulant, METFORMINE, fonction rénale sont les informations utiles).
OBJECTIF=Si la patiente ou le patient prend de la METFORMINE, terminer par « Je lui demande de stopper la METFORMINE 48 heures avant l'examen. » ; sinon ne rien ajouter.

[REVISION_FINALE]
APPEL_API=OUI
