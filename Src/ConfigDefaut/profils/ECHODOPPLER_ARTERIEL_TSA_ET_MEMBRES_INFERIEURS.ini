; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Cles informatives NON lues par le logiciel : DESTINATION_MODE, REGROUPEMENT, [REVISION_FINALE], FORME, UNE_PHRASE_PAR_LIGNE, MEDICAMENTS, TELEGRAPHIQUE_TRAITEMENT
; Style reel du medecin (24 lettres) : 1 a 3 lignes. Demande + terrain dans la premiere phrase,
; puis "L'examen vasculaire peripherique est normal.", eventuellement "Merci de confirmer ...".

[IDENTITE]
CODE=ECHODOPPLER_ARTERIEL_TSA_ET_MEMBRES_INFERIEURS
LIBELLE=échodoppler des vaisseaux du cou et des membres inférieurs
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=ECHODOPPLER_ARTERIEL,ECHODOPPLER_VAISSEAUX_DU_COU
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN}{MODALITE} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.
; Variantes reellement employees, a choisir selon le courrier :
; Merci de réaliser un échodoppler des vaisseaux du cou et des membres inférieurs de principe à {PATIENT}, asymptomatique.
; Merci de réaliser un échodoppler des vaisseaux du cou et des membres inférieurs à {PATIENT}, hypertendue, diabétique de type 2.
; Merci de réaliser un échodoppler des vaisseaux du cou et des membres inférieurs à {PATIENT}, qui présente une dyslipidémie et une hypertension artérielle.
; Merci de réaliser un échodoppler des vaisseaux du cou et des membres inférieurs dans le cadre du bilan d'une hypertension artérielle à {PATIENT}, asymptomatique.
; Merci de réaliser un échodoppler des vaisseaux du cou et des membres inférieurs pour évaluer le terrain artériel de {PATIENT}, qui présente une dyslipidémie isolée.
; Merci de réaliser un échodoppler des vaisseaux du cou et des membres inférieurs de contrôle à {PATIENT}, qui présente une sténose carotide interne droite à 60 % NASCET.

[MOTIF]
; Le motif est le terrain, en apposition ou introduit par "qui présente" : facteurs de risque, symptome ou son absence, lesion vasculaire connue.
DEFAUT=
FORMES=asymptomatique;hypertendu(e), diabétique de type 2, dyslipidémique;qui présente une dyslipidémie et une hypertension artérielle;qui présente une sténose carotidienne connue;aux antécédents de ...

[MODALITES]
de principe= de principe
systematique= de façon systématique
controle= de contrôle
bilan hta= dans le cadre du bilan d'une hypertension artérielle
bilan diabete= dans le cadre du bilan d'un diabète et d'une hypertension artérielle
terrain arteriel=Merci de réaliser un échodoppler des vaisseaux du cou et des membres inférieurs pour évaluer le terrain artériel de {PATIENT}{AGE_SEGMENT}, {MOTIF}.

[STRUCTURE]
ORDRE=EXAMEN_VASCULAIRE;TRAITEMENT;ANTECEDENT_VASCULAIRE;OBJECTIF
OBLIGATOIRE=EXAMEN_VASCULAIRE
OBLIGATOIRE_SI_PRESENT=ANTECEDENT_VASCULAIRE
OPTIONNEL=TRAITEMENT;OBJECTIF
INTERDIT=CONTEXTE_TSA;CONTEXTE_MEMBRES_INFERIEURS;FACTEURS_RISQUE;ECG;ECHOGRAPHIE;CONCLUSION

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=4
; Une phrase par ligne. Pas de phrase de courtoisie distincte : la lettre se termine sur l'examen vasculaire ou sur l'objectif.
; Les facteurs de risque vont dans la premiere phrase (apposition), jamais dans une rubrique separee.

[OBJECTIF]
; Facultatif (1 lettre sur 3). A ajouter quand le terrain est a risque ou en cas de controle d'une lesion connue.
MODELE=Merci de confirmer l'absence d'atteinte vasculaire périphérique significative.
VARIANTES=Merci de vérifier l'absence d'atteinte vasculaire périphérique significative vu le terrain à risque.;Merci de confirmer l'intégrité du réseau artériel.;Merci de confirmer l'absence d'évolutivité carotidienne notamment.;Merci de vérifier l'absence d'évolutivité.

[PREFIXES]
EXAMEN_VASCULAIRE=L'examen vasculaire périphérique est
TRAITEMENT=Il est traité par
ANTECEDENT_VASCULAIRE=

[SELECTION]
EXAMEN_VASCULAIRE=examen vasculaire;souffle;pouls;pouls distaux;normal
TRAITEMENT=antiagregant;kardegic;statine;antihypertenseur;association;equilibre par;traite par
ANTECEDENT_VASCULAIRE=stenose;plaque;carotide;doppler;angioplastie;pontage;revascularise;arteriopathie;claudication;ait;avc
OBJECTIF=confirmer;verifier;evolutivite;atteinte vasculaire

[INSTRUCTIONS]
EXAMEN_VASCULAIRE=Une seule phrase, presque toujours "L'examen vasculaire périphérique est normal." ; si un souffle ou une abolition de pouls est notee dans le courrier, la citer a la place.
TRAITEMENT=Seulement si le traitement est pertinent pour le terrain (antiagregant, statine, antihypertenseur), en une proposition courte : "hypertendu équilibré par X" ou "sous l'association X Y Z", de preference rattachee a la premiere phrase.
ANTECEDENT_VASCULAIRE=Seulement si le courrier mentionne une lesion vasculaire connue, un doppler anterieur ou une revascularisation : une phrase factuelle avec date et pourcentage ("Il est fait état sur un doppler de sténose < 50 % en novembre 2023.").
OBJECTIF=Facultatif. Une phrase commençant par "Merci de confirmer" ou "Merci de vérifier". En cas de lesion connue : "l'absence d'évolutivité" ; sinon "l'absence d'atteinte vasculaire périphérique significative". Ne pas ajouter de phrase de courtoisie ni "Je te serais reconnaissant".

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
