; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Style reel du medecin (10 lettres au CCN) : "Merci de prendre en charge [rapidement|comme prevu] Monsieur X. Y., 54 ans,
; hypertendu, tabagique sevre, qui presente depuis un mois et demi ..." puis 3 a 5 lignes, puis demande directe finale.
; Le mot "hospitalisation" n'est jamais ecrit : on "prend en charge".

[IDENTITE]
CODE=HOSPITALISATION_CCN
LIBELLE=prise en charge au CCN
ARTICLE=une
NATURE=HOSPITALISATION
TYPE_BASE=HOSPITALISATION_CCN
DESTINATION_MODE=BASE
REGROUPEMENT=JAMAIS

[PREMIER_PARAGRAPHE]
MODELE=Merci de prendre en charge{DEGRE_URGENCE} {PATIENT}{AGE_SEGMENT}, {TERRAIN}qui présente {MOTIF}.
; Variantes reelles : "..., que je découvre ce jour." / "..., qui a présenté, il y a 72 heures, ..." / "..., aux antécédents de ..., dans un contexte de ..."
; {TERRAIN} = facteurs de risque ou antecedent majeur en apposition, avec virgule finale ("hypertendu, tabagique sevré de très longue date, "), vide sinon.

[MOTIF]
DEFAUT=le tableau clinique décrit ci-dessous

[STRUCTURE]
ORDRE=ANAMNESE;TRAITEMENTS;EXAMEN_CLINIQUE;ECG;ECHOGRAPHIE;EXAMENS_FONCTIONNELS;INTERPRETATION;PRISE_EN_CHARGE_ATTENDUE
OBLIGATOIRE=ANAMNESE;PRISE_EN_CHARGE_ATTENDUE
OBLIGATOIRE_SI_PRESENT=ECHOGRAPHIE;EXAMENS_FONCTIONNELS;INTERPRETATION
OPTIONNEL=TRAITEMENTS;EXAMEN_CLINIQUE;ECG
INTERDIT=EXAMEN_CLINIQUE_DETAILLE;HOLTER;CONCLUSION_AU_TOTAL;RENOUVELLEMENT_TRAITEMENT;SUIVI_ULTERIEUR

[STYLE]
LONGUEUR=MOYENNE
PARAGRAPHES_MAX=6

[OBJECTIF]
MODELE=Merci de {PRONOM_OBJET} prendre en charge{DEGRE_URGENCE}.
; Phrases finales reelles, a preferer quand l'examen attendu est nomme dans le courrier :
; "Merci de prendre en charge rapidement pour exploration." / "Merci de réaliser une coronarographie."
; "Vu le terrain à risque et les caractères de la douleur, merci de le prendre en charge en vue d'une coronarographie diagnostique."
; "Merci de faire la part d'une coronaropathie ou d'une dégradation de la fonction systolique sur une sténose aortique évolutive."
; "Merci de l'évaluer un peu plus précisément et de discuter d'une prise en charge chirurgicale avec lui."
; "Je te laisse le soin d'envisager une coronarographie et de discuter des possibilités de revascularisation dans ce cadre."
; Pas de phrase de courtoisie supplementaire : la demande finale est suivie directement de la formule de politesse.

[PREFIXES]
TRAITEMENTS=Son traitement associe
EXAMEN_CLINIQUE=L'examen n'est pas contributif
ECG=L'électrocardiogramme est
ECHOGRAPHIE=En échographie, je retrouve
EXAMENS_FONCTIONNELS=Le test d'effort
INTERPRETATION=La symptomatologie

[SELECTION]
ANAMNESE=douleur;angor;dyspnee;aggravation;depuis;inhabituel;recidive;degradation;decompensation;malaise;syncope;oedeme
TRAITEMENTS=traitement;anticoagulant;eliquis;xarelto;betabloquant;isoptine;diuretique;antiagregant
EXAMEN_CLINIQUE=examen;non contributif;souffle;turgescence;oedeme;epanchement
ECG=electrocardiogramme;ecg;trace;normal;fibrillation;extrasystolie;repolarisation
ECHOGRAPHIE=echographie;fraction d ejection;gradient moyen;stenose aortique;fuite mitrale;hypertrophie;pressions de remplissage;dysfonction
EXAMENS_FONCTIONNELS=test d effort;scintigraphie;scintigramme;ischemie;sous-decalage;coroscanner;pontage
INTERPRETATION=ressemble;oriente;evoque;vu le terrain;vu les caracteres;angor instable;coronaropathie;probable
PRISE_EN_CHARGE_ATTENDUE=coronarographie;revascularisation;chirurgie;prise en charge;exploration;evaluer;discuter

[INSTRUCTIONS]
ANAMNESE=Une a deux phrases sur les symptomes et leur evolution recente, telles que le courrier les decrit (delai, caractere inhabituel, aggravation). Pas d'interlocuteur direct.
TRAITEMENTS=Une seule ligne, liste des medicaments en majuscules sans virgules, seulement si le traitement pese sur la prise en charge (anticoagulant, antiangineux).
EXAMEN_CLINIQUE=Une seule formule courte : "L'examen n'est pas contributif." ou le seul signe decisif (turgescence, epanchement). Jamais la tension ni l'auscultation detaillees.
ECG=Une seule ligne : "L'électrocardiogramme est normal." ou l'anomalie decisive ("Sur le tracé, on note ...").
ECHOGRAPHIE=Une ligne avec les chiffres decisifs (FEVG, gradient moyen, SOR), uniquement quand l'echographie motive la demande.
EXAMENS_FONCTIONNELS=Une ligne sur le test d'effort ou la scintigraphie quand ils motivent la coronarographie.
INTERPRETATION=Hypothese du medecin en une phrase, reprise du courrier ("La symptomatologie ressemble fortement à un angor instable", "orientant plutôt vers une coronaropathie associée"). Ne rien inventer si le courrier ne la formule pas.
PRISE_EN_CHARGE_ATTENDUE=Demande directe a l'imperatif "Merci de ...", nommant l'examen ou le geste attendu s'il est ecrit dans le courrier ; sinon "Merci de le/la prendre en charge."

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI

[MODALITES]
programmée=
rapidement= rapidement
comme prévu= comme prévu
un peu plus tôt que prévu= un peu plus tôt que prévu
