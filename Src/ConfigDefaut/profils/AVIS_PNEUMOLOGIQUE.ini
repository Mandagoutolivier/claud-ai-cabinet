; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT} {AGE_SEGMENT} {EXAMEN} {MOTIF}
; [STRUCTURE] ORDRE : rubriques du corps, dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (2-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [PREFIXES] : debut de phrase impose pour une rubrique ; [SELECTION] : mots-cles guidant l'extraction
; [MODALITES] (facultatif) : libelle=texte de l'examen, propose au medecin par Ctrl+Alt+D
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)

[IDENTITE]
