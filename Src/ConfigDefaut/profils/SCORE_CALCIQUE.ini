; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Profil calibre sur 10 lettres reelles du medecin : une a trois phrases, facteurs de risque
; en apposition dans la phrase de demande, jamais d'ECG, d'echographie ni de bilan chiffre.

[IDENTITE]
CODE=SCORE_CALCIQUE
LIBELLE=score calcique
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=SCORE_CALCIQUE
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.
; Le {MOTIF} est la liste des facteurs de risque, en apposition : "dyslipidémique",
; "diabétique de type 2, dyslipidémique", "hypertendue dyslipidémique asymptomatique en prévention primaire",
; ou sous la forme "qui présente une dyslipidémie légère dans un contexte d'hypertension artérielle"
; (dans ce cas la virgule avant "qui" est supprimée).
; Exemples reels :
;   Merci de réaliser un score calcique à Madame S. B., 61 ans, dyslipidémique.
;   Merci de réaliser un score calcique à Madame P. D., 58 ans, diabétique de type 2, dyslipidémique.
;   Merci de réaliser un score calcique à Madame J. C., 73 ans, qui présente une dyslipidémie légère dans un contexte d'hypertension artérielle.
;   Merci de réaliser un score calcique à Monsieur R. B. qui a de faibles facteurs de risque cardiovasculaire (glycémie limite, tabagisme sevré de longue date).
;   Merci de réaliser un score calcique à Madame S. C., 63 ans, aux antécédents d'accident ischémique transitoire en 2009.

[MOTIF]
DEFAUT=en prévention primaire

[STRUCTURE]
ORDRE=FACTEURS_RISQUE;SYMPTOMES;TRAITEMENT;OBJECTIF
OBLIGATOIRE=FACTEURS_RISQUE
OBLIGATOIRE_SI_PRESENT=
OPTIONNEL=SYMPTOMES;TRAITEMENT;OBJECTIF
INTERDIT=EXAMEN_CLINIQUE;ECG;ECHOGRAPHIE;HOLTER;MAPA;BIOLOGIE_GENERALE;BIOLOGIE_LIPIDIQUE;ANTECEDENTS_CORONARIENS;CONCLUSION

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=2
; Une seule phrase suffit le plus souvent ; trois phrases au maximum.
; Pas de "Je revois", pas de "Au total", pas de "Je te tiens informé".

[OBJECTIF]
MODELE=Merci de préciser son risque coronarien.
; Facultatif : omis si la phrase de demande se suffit. Autres formes reelles :
;   Merci d'évaluer plus précisément son risque vasculaire.
;   Merci de confirmer l'absence d'évolutivité significative. (modalite CONTROLE)

[PREFIXES]
FACTEURS_RISQUE=
SYMPTOMES=Elle est / Il est
TRAITEMENT=Elle est traitée par / Il est traité par
OBJECTIF=Merci de

[SELECTION]
FACTEURS_RISQUE=hypertension arterielle;hypertendu;diabete;diabetique;dyslipidemie;dyslipidemique;tabagisme;tabac;surcharge ponderale;surpoids;obesite;apnee du sommeil;glycemie limite;antecedents familiaux;accident ischemique transitoire;prevention primaire;facteur de risque
SYMPTOMES=asymptomatique;aucune douleur thoracique;pas de douleur;pas de dyspnee;aucun symptome;sur le plan cardiovasculaire
TRAITEMENT=traite par;traitement;statine;aspirine
OBJECTIF=risque coronarien;risque vasculaire;evolutivite;statine;interet d'un traitement

[INSTRUCTIONS]
FACTEURS_RISQUE=Integrer les facteurs de risque dans la phrase de demande elle-meme, en apposition apres le patient (adjectifs juxtaposes : hypertendu(e), dyslipidemique, diabetique de type 2, en surcharge pondérale, tabagique) ou par "qui presente ...". Qualifier si le courrier le fait (dyslipidemie legere / isolee, diabete desequilibre, tabagisme sevre de longue date). Ne jamais ecrire "Les facteurs de risque comprennent". Pas de chiffres de bilan lipidique.
SYMPTOMES=Une seule phrase courte, uniquement si le courrier l'indique : "Elle est asymptomatique." ou "Il est asymptomatique sur le plan cardiovasculaire." Eventuellement "Il n'a pas d'autre facteur de risque majeur que le diabete." Pas d'examen clinique, pas d'ECG, pas d'echographie.
TRAITEMENT=Une seule ligne, seulement si le traitement est pertinent pour le risque (statine, antiagregant) : "Elle est traitée par ASPIRINE INEGY COVERAM." Medicaments en majuscules, sans posologie.
OBJECTIF=Facultatif. Une phrase imperative commencant par "Merci de" : preciser son risque coronarien / evaluer plus precisement son risque vasculaire / confirmer l'absence d'evolutivite significative. Ne pas ajouter de formule declarative ("Cet examen permettra...").

[MODALITES]
De principe=un score calcique de principe
Contrôle=Merci de réévaluer le score calcique de {PATIENT}{AGE_SEGMENT}, {MOTIF}, dont le précédent score calcique était à {VALEUR}.
; Modalite Contrôle : le premier paragraphe remplace celui du modele, {VALEUR} = score anterieur ;
; objectif : "Merci de confirmer l'absence d'évolutivité significative."

[REVISION_FINALE]
APPEL_API=NON
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
