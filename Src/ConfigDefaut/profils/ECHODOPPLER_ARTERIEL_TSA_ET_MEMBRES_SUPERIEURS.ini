; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Cles informatives NON lues par le logiciel : DESTINATION_MODE, REGROUPEMENT, [REVISION_FINALE], FORME, UNE_PHRASE_PAR_LIGNE, MEDICAMENTS, TELEGRAPHIQUE_TRAITEMENT
; Nouveau profil (1 lettre reelle) : symptome du membre superieur avec examen vasculaire normal.
; A ajouter dans examens.txt : echodoppler des vaisseaux du cou et des membres superieurs|ECHODOPPLER_ARTERIEL_TSA_ET_MEMBRES_SUPERIEURS

[IDENTITE]
CODE=ECHODOPPLER_ARTERIEL_TSA_ET_MEMBRES_SUPERIEURS
LIBELLE=échodoppler des vaisseaux du cou et des membres supérieurs
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=ECHODOPPLER_ARTERIEL,ECHODOPPLER_VAISSEAUX_DU_COU
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.
; Reel : Merci de réaliser un échodoppler des vaisseaux du cou et des membres supérieurs à {PATIENT}, qui présente une sensation de refroidissement du membre supérieur gauche intermittent avec un examen vasculaire toutefois normal.

[MOTIF]
DEFAUT=

[STRUCTURE]
ORDRE=EXAMEN_VASCULAIRE;OBJECTIF
OBLIGATOIRE=OBJECTIF
OBLIGATOIRE_SI_PRESENT=EXAMEN_VASCULAIRE
OPTIONNEL=
INTERDIT=FACTEURS_RISQUE;TRAITEMENTS;ECG;ECHOGRAPHIE;CONCLUSION

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=3

[OBJECTIF]
MODELE=Merci de vérifier l'absence d'atteinte vasculaire périphérique significative notamment du membre supérieur concerné.

[PREFIXES]
EXAMEN_VASCULAIRE=L'examen vasculaire périphérique est

[SELECTION]
EXAMEN_VASCULAIRE=examen vasculaire;pouls;souffle;normal
OBJECTIF=atteinte vasculaire;membre superieur

[INSTRUCTIONS]
EXAMEN_VASCULAIRE=Omettre si deja dit dans la premiere phrase ("avec un examen vasculaire toutefois normal").
OBJECTIF=Une phrase "Merci de vérifier l'absence d'atteinte vasculaire périphérique significative notamment du membre supérieur [côté]." Pas de courtoisie supplementaire.

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
