OBJECTIF=embolie pulmonaire;coeur pulmonaire chronique;post-embolique;thrombo-embolique

[INSTRUCTIONS]
TABLEAU=Une seule phrase rattachee a la demande par "qui présente un tableau de ...". Enchainer sans rubrique ni prefixe distinct, avec "avec" et des virgules, les elements du courrier principal dans cet ordre : clinique (si presente), echographie (cavites droites, insuffisance tricuspidienne, veine cave, pressions pulmonaires, cavites gauches), ECG (bloc droit, onde P pulmonaire, aspect de coeur pulmonaire). Ne rien inventer, ne pas citer la biologie ni les antecedents, pas de "Au total".
OBJECTIF=Une phrase unique commencant par "Merci de faire la part de" suivie de l'hypothese diagnostique posee dans le courrier principal (coeur pulmonaire chronique post-embolique, embolie pulmonaire). Pas d'autre phrase de courtoisie.
