; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Cles informatives NON lues par le logiciel : DESTINATION_MODE, REGROUPEMENT, [REVISION_FINALE], FORME, UNE_PHRASE_PAR_LIGNE, MEDICAMENTS, TELEGRAPHIQUE_TRAITEMENT
; Style reel (1 lettre de reference) : une seule phrase de demande qui porte l'examen, l'hypothese
; diagnostique et le tableau echographique + ECG enchaines par "avec", puis une phrase "Merci de faire la part de ...".

[IDENTITE]
CODE=ANGIOSCANNER_PULMONAIRE
LIBELLE=angioscanner pulmonaire
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=ANGIOSCANNER PULMONAIRE
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.

[MOTIF]
DEFAUT=
EXEMPLES=qui présente un tableau d'insuffisance ventriculaire droite exclusive avec dilatation importante du ventricule droit, insuffisance tricuspidienne torrentielle, dilatation de la veine cave et aspect électrique de cœur pulmonaire

[MODALITES]
Pathologie thrombo-embolique=un angioscanner pulmonaire à la recherche d'une pathologie thrombo-embolique
Coeur pulmonaire chronique post-embolique=un angioscanner pulmonaire à la recherche d'un cœur pulmonaire chronique post-embolique
Embolie pulmonaire aiguë=un angioscanner pulmonaire à la recherche d'une embolie pulmonaire

[STRUCTURE]
ORDRE=
OBLIGATOIRE=
OBLIGATOIRE_SI_PRESENT=OPTIONNEL=
INTERDIT=INDICATION;FACTEURS_THROMBOEMBOLIQUES;BIOLOGIE;IMAGERIE_ANTERIEURE;ANTECEDENTS;CONCLUSION
OPTIONNEL=

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=2

[OBJECTIF]
MODELE=Merci de faire la part d'un cœur pulmonaire chronique post-embolique.
VARIANTES=Merci de faire la part d'une embolie pulmonaire.;Merci de faire la part d'un cœur pulmonaire chronique post-embolique.

[PREFIXES]
TABLEAU=qui présente un tableau de
OBJECTIF=Merci de faire la part de

