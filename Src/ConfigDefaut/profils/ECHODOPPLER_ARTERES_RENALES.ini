; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Cles informatives NON lues par le logiciel : DESTINATION_MODE, REGROUPEMENT, [REVISION_FINALE], FORME, UNE_PHRASE_PAR_LIGNE, MEDICAMENTS, TELEGRAPHIQUE_TRAITEMENT
; Nouveau profil (1 lettre reelle) : echodoppler des reins, des arteres renales et des surrenales pour HTA severe ou resistante.
; Distinct de ANGIOSCANNER_RENAL_SURRENALIEN. A ajouter dans examens.txt :
; echodoppler des arteres renales|ECHODOPPLER_ARTERES_RENALES ; doppler des arteres renales|ECHODOPPLER_ARTERES_RENALES ; echodoppler des reins|ECHODOPPLER_ARTERES_RENALES

[IDENTITE]
CODE=ECHODOPPLER_ARTERES_RENALES
LIBELLE=échodoppler des reins, des artères rénales et des surrénales
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=ECHODOPPLER_ARTERIEL
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.
; Reel : Merci de réaliser un échodoppler des reins des artères rénales et des surrénales à {PATIENT}, qui présente une hypertension artérielle très sévère jusqu'à 280/130.

[MOTIF]
DEFAUT=
FORMES=qui présente une hypertension artérielle très sévère jusqu'à X/Y;qui présente une hypertension artérielle résistante

[STRUCTURE]
ORDRE=TRAITEMENT;OBJECTIF
OBLIGATOIRE=OBJECTIF
OBLIGATOIRE_SI_PRESENT=TRAITEMENT
OPTIONNEL=
INTERDIT=MAPA;BIOLOGIE_RENALE;BIOLOGIE_HORMONALE;IMAGERIE_ANTERIEURE;ECG;ECHOGRAPHIE;CONCLUSION

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=3

[OBJECTIF]
MODELE=Merci de vérifier l'absence d'argument pour une hypertension rénovasculaire ou une atteinte rénale ou surrénalienne.

[PREFIXES]
TRAITEMENT=Elle est partiellement corrigée par l'association

[SELECTION]
TRAITEMENT=antihypertenseur;association;iec;ara2;diuretique;alpha-bloquant;corrigee;equilibree
OBJECTIF=renovasculaire;renale;surrenalienne

[INSTRUCTIONS]
TRAITEMENT=Une phrase : degre de controle tensionnel et association antihypertensive en cours, avec les noms commerciaux et les doses tels qu'ils figurent dans le courrier.
OBJECTIF=Une phrase "Merci de vérifier l'absence d'argument pour une hypertension rénovasculaire ou une atteinte rénale ou surrénalienne." Pas de courtoisie supplementaire.

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
