; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Lettre de reference (PATIENT_001491, controle de pacemaker) :
;   Merci de revoir le pacemaker de Madame D. E., 88 ans, asymptomatique.
;   Le trace initial est en rythme sinusal avec un BAV un a 0,40 sur un QRS natif avec bloc droit complet.
;   Sous aimant, on passe en D00 puis, apres quelques minutes, on observe des passages avec PR long electro entraine en VVI.
;   Y a-t-il un defaut d'ecoute auriculaire ou s'agit-il d'un logiciel d'adaptation pour reduire le taux de stimulation ventriculaire ?
;   Merci de recontroler sa pile.

[IDENTITE]
CODE=AVIS_RYTHMOLOGIQUE
LIBELLE=avis rythmologique
ARTICLE=un
NATURE=CONSULTATION
TYPE_BASE=AVIS_RYTHMOLOGIE
DESTINATION_MODE=A_COMPLETER
REGROUPEMENT=JAMAIS

[PREMIER_PARAGRAPHE]
MODELE=Merci de revoir {EXAMEN} de {PATIENT}{AGE_SEGMENT}, {MOTIF}.

[MOTIF]
DEFAUT=asymptomatique

[STRUCTURE]
ORDRE=DEMANDE_ET_SYMPTOMES;ECG;QUESTION;DEMANDE_FINALE
OBLIGATOIRE=DEMANDE_ET_SYMPTOMES;ECG;DEMANDE_FINALE
OBLIGATOIRE_SI_PRESENT=QUESTION
OPTIONNEL=
INTERDIT=ANTECEDENTS;EXAMEN_CLINIQUE;ECHOGRAPHIE;BIOLOGIE;ANTICOAGULATION;CONCLUSION_COMPTE_RENDU

[STYLE]
LONGUEUR=MOYENNE
PARAGRAPHES_MAX=5

[OBJECTIF]
MODELE=Merci de recontrôler sa pile.

[PREFIXES]
ECG=Le tracé initial est en
DEMANDE_FINALE=Merci de

[MODALITES]
Pacemaker=le pacemaker
Défibrillateur=le défibrillateur
Trouble du rythme=la situation rythmique

[SELECTION]
DEMANDE_ET_SYMPTOMES=pacemaker;pile;stimulateur;défibrillateur;asymptomatique;palpitations;malaise;syncope
ECG=électrocardiogramme;ecg;tracé;rythme sinusal;bav;pr;qrs;bloc droit;bloc gauche;aimant;d00;vvi;ddd;stimulation;électro-entraîné;fibrillation;flutter;pause
QUESTION=y a-t-il;s'agit-il;défaut;écoute;logiciel;algorithme;question
DEMANDE_FINALE=recontrôler;contrôle;pile;interrogation;réglage;programmation

[INSTRUCTIONS]
DEMANDE_ET_SYMPTOMES=Premiere phrase unique : « Merci de revoir [le pacemaker / la situation rythmique] de {PATIENT}, asymptomatique. » ou avec le symptome en apposition.
ECG=Deux phrases au plus : le trace de base (rythme, PR, QRS, bloc) puis, s'il y a lieu, le comportement sous aimant ou l'anomalie observee (« Sous aimant, on passe en ... puis on observe ... »). Reprendre les chiffres et modes de stimulation tels quels.
QUESTION=Une question directe a la forme interrogative reprenant celle du courrier principal (« Y a-t-il ... ou s'agit-il de ... ? »). Omettre si aucune question n'est formulee.
DEMANDE_FINALE=Une phrase breve « Merci de recontrôler sa pile. » ou « Merci de revoir la programmation. » selon le courrier.
GENERAL=4 a 5 lignes, une phrase par ligne, vouvoiement, pas d'anticoagulation, d'echographie, de Holter ni de biologie sauf si la question posee en depend.

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
