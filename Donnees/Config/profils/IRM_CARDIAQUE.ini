; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Calibrage : aucune lettre manuscrite d'IRM cardiaque dans le corpus ; style repris des lettres IRM cerebrale / avis genetique du medecin (3-4 lignes, une phrase par ligne, question finale directe).

[IDENTITE]
CODE=IRM_CARDIAQUE
LIBELLE=IRM cardiaque
ARTICLE=une
NATURE=EXAMEN
TYPE_BASE=IRM
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.

[MOTIF]
DEFAUT=chez qui l'échocardiographie retrouve une anomalie à préciser

[STRUCTURE]
ORDRE=CONTEXTE;ANAMNESE;TRAITEMENTS;QUESTION
OBLIGATOIRE=CONTEXTE;QUESTION
OBLIGATOIRE_SI_PRESENT=TRAITEMENTS
OPTIONNEL=ANAMNESE
INTERDIT=EXAMEN_CLINIQUE;ECG;HOLTER;BIOLOGIE_RENALE;CONCLUSION

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=4

[OBJECTIF]
MODELE=Merci de déterminer s'il existe une cardiopathie sous-jacente et d'en préciser la nature.

[PREFIXES]
CONTEXTE=aux antécédents de
ANAMNESE=Elle a présenté
TRAITEMENTS=Son traitement associe
QUESTION=Merci de déterminer

[SELECTION]
CONTEXTE=hypertrophie;septale;cardiomyopathie;dilatation;ventricule droit;hypokinesie;akinesie;fevg;epaisseur;antecedents;hypertendu;asymptomatique
ANAMNESE=dyspnee;douleur;palpitations;syncope;malaise;asymptomatique;evolution
TRAITEMENTS=traitement;poursuit;association;betabloquant;antiarythmique;anticoagulant;diuretique;statine
QUESTION=etiqueter;preciser;determiner;myocardite;amylose;fibrose;rehaussement tardif;infiltration;enquete familiale;sarcomerique;masse;thrombus;pericarde;vérifier

[INSTRUCTIONS]
CONTEXTE=Une seule phrase accrochée à l'identité du patient : facteurs de risque ou antécédents utiles puis l'anomalie échographique ou clinique qui motive l'IRM (ex. « hypertendue, asymptomatique, chez qui l'échographie retrouve une hypertrophie septale de 15 mm non obstructive »). Pas de rubrique séparée, pas d'interlocuteur direct.
ANAMNESE=Une phrase au plus, uniquement si un symptôme ou un événement daté est utile (« Elle a présenté ... »). Omettre si asymptomatique déjà dit dans le contexte.
TRAITEMENTS=Une ligne : « Son traitement associe A – B – C. » ou « Il poursuit l'association A B C. », médicaments en majuscules, sans posologie.
QUESTION=Dernière ligne, question directe au confrère commençant par « Merci de déterminer ... » ou « Merci de préciser ... » : ce que l'IRM doit trancher (nature de l'hypertrophie, myocardite, amylose, fibrose, intérêt d'une enquête familiale). Reprendre les mots du courrier principal (« étiqueter correctement cette anomalie », « en savoir plus »).

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
