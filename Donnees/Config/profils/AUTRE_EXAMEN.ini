; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Profil generique (examen radiologique ou autre hors profils dedies), etabli sur les lettres reelles :
; une phrase de demande avec le motif accroche au patient, une ligne de contexte ou d'examen clinique,
; le traitement seulement s'il conditionne l'examen, et une question precise ou une consigne pratique en fin.

[IDENTITE]
CODE=AUTRE_EXAMEN
LIBELLE=examen complémentaire
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=AUTRE_EXAMEN
DESTINATION_MODE=A_COMPLETER
REGROUPEMENT=JAMAIS

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.

[MOTIF]
DEFAUT=qui présente le tableau clinique décrit ci-après
; Le motif est une proposition relative accrochee au patient, reprise mot pour mot de la phrase de prescription :
; « qui présente un anévrisme de l'aorte abdominale de l'ordre de 48 mm en Echo-doppler »
; « que je découvre, ce jour, en fibrillation auriculaire dans un contexte de cardiopathie ischémique bien stabilisée sur des antécédents d'angioplastie IVA en 2020 »

[STRUCTURE]
ORDRE=ANAMNESE;EXAMEN_CLINIQUE;TRAITEMENTS;OBJECTIF
OBLIGATOIRE=OBJECTIF
OBLIGATOIRE_SI_PRESENT=ANAMNESE;EXAMEN_CLINIQUE
OPTIONNEL=TRAITEMENTS
INTERDIT=INDICATION;ECG;ECHOGRAPHIE;HOLTER;MAPA;BIOLOGIE;IMAGERIE

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=4

[OBJECTIF]
MODELE=Merci de vérifier l'absence de {QUESTION_POSEE}.
; La derniere phrase est soit la question precise posee au radiologue (« Merci de vérifier l'absence d'infarctus splénique vu la douleur récente et l'arythmie. »),
; soit une consigne pratique liee a l'examen (« Je lui demande de stopper la METFORMINE 48 heures avant l'examen. »).
; Pas de phrase de courtoisie, pas de « Cet examen permettra de ... ».

[PREFIXES]
ANAMNESE=Dans ce contexte de
EXAMEN_CLINIQUE=L'examen révèle
TRAITEMENTS=Traitement habituel :

[SELECTION]
ANAMNESE=douleur;symptome;contexte;decouverte;arythmie;fibrillation;anevrisme
EXAMEN_CLINIQUE=examen;palpable;sensible;masse;souffle;oedeme
TRAITEMENTS=metformine;anticoagulant;xarelto;eliquis;pradaxa;lixiana;previscan;iode;allergie;insuffisance renale
OBJECTIF=verifier;rechercher;eliminer;absence;infarctus;embolie;lesion;stopper

[INSTRUCTIONS]
ANAMNESE=Une seule phrase, uniquement si le symptôme ou le contexte motivant l'examen n'est pas déjà dans la première phrase ; commencer par « Dans ce contexte de ..., il/elle présente ... ». Ne pas reprendre les antécédents déjà cités.
EXAMEN_CLINIQUE=Une seule phrase avec le seul élément clinique en rapport avec l'examen demandé (« L'examen révèle une pointe de rate palpable et sensible ... »). Ne pas citer la pression artérielle, l'auscultation ni l'ECG s'ils ne concernent pas l'examen.
TRAITEMENTS=Uniquement si le traitement conditionne la réalisation de l'examen (produit de contraste : METFORMINE, fonction rénale ; anticoagulant ; allergie). Ligne télégraphique : « Traitement habituel : » puis les noms des médicaments en majuscules séparés par des espaces, sans posologie. Si METFORMINE et examen injecté, ajouter la consigne « Je lui demande de stopper la METFORMINE 48 heures avant l'examen. » en dernière phrase.
OBJECTIF=Terminer par une phrase précise : la question posée au confrère (« Merci de vérifier l'absence de ... vu ... ») ou la consigne pratique liée à l'examen. Aucune phrase de courtoisie, aucune formule générique.

[MODALITES]
sans injection=un scanner {ORGANE} sans injection
avec injection=un scanner {ORGANE} avec injection
angioscanner=un angioscanner {TERRITOIRE}

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
