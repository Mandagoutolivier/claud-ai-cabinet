; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Cles informatives NON lues par le logiciel : DESTINATION_MODE, REGROUPEMENT, [REVISION_FINALE], FORME, UNE_PHRASE_PAR_LIGNE, MEDICAMENTS, TELEGRAPHIQUE_TRAITEMENT
; Lettre de reference (PATIENT_001316) :
;   Merci de revoir Madame L. C., 74 ans, qui presente une discrete asymetrie des arteres iliaques a 13 mm a droite et 11 mm a gauche sans autre anomalie vasculaire peripherique.
;   Votre echodoppler remonte a 2022.
;   Merci de confirmer l'absence d'evolutivite chez une patiente hypertendue parfaitement equilibree par LODOZ.

[IDENTITE]
CODE=AVIS_VASCULAIRE
LIBELLE=avis vasculaire
ARTICLE=un
NATURE=CONSULTATION
TYPE_BASE=AVIS_VASCULAIRE
DESTINATION_MODE=A_COMPLETER
REGROUPEMENT=JAMAIS

[PREMIER_PARAGRAPHE]
MODELE=Merci de revoir {PATIENT}{AGE_SEGMENT}, {MOTIF}.

[MOTIF]
DEFAUT=

[STRUCTURE]
ORDRE=EXAMEN_ANTERIEUR
OBLIGATOIRE=
OBLIGATOIRE_SI_PRESENT=EXAMEN_ANTERIEUR
OPTIONNEL=
INTERDIT=ANTECEDENTS;EXAMEN_CLINIQUE;ECG;ECHOGRAPHIE;BIOLOGIE;CONCLUSION_COMPTE_RENDU

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=4

[OBJECTIF]
MODELE=Merci de confirmer l'absence d'évolutivité.

[PREFIXES]
EXAMEN_ANTERIEUR=Le dernier échodoppler remonte à
DEMANDE_FINALE=Merci de confirmer

[SELECTION]
CONSTAT_VASCULAIRE=asymétrie;anévrisme;iliaque;aorte;carotide;fémorale;plaque;sténose;mm;sans autre anomalie;discret
EXAMEN_ANTERIEUR=votre;échodoppler;doppler;remonte à;dernier;2019;2020;2021;2022;2023;2024;2025
DEMANDE_FINALE=évolutivité;confirmer;recontrôler;hypertendu;équilibré;traitement

[INSTRUCTIONS]
CONSTAT_VASCULAIRE=Premiere phrase unique : « Merci de revoir {PATIENT}, qui présente ... » avec l'anomalie vasculaire, ses mesures exactes (mm, cote) et la mention « sans autre anomalie vasculaire périphérique » si elle figure dans le courrier.
EXAMEN_ANTERIEUR=Une phrase : « Le dernier échodoppler remonte à [année]. » Omettre si aucune date n'est connue.
DEMANDE_FINALE=Une phrase « Merci de confirmer l'absence d'évolutivité ... » ; y glisser le contexte tensionnel et le traitement (« chez une patiente hypertendue parfaitement équilibrée par ... ») s'ils figurent dans le courrier.
GENERAL=3 lignes au maximum, une phrase par ligne, registre selon le tutoiement indiqué, aucune rubrique antecedents, clinique, biologie ou echographie.
MOTIF=Premiere phrase unique : « Merci de revoir {PATIENT}, qui présente ... » avec l'anomalie vasculaire, ses mesures exactes (mm, cote) et la mention « sans autre anomalie vasculaire périphérique » si elle figure dans le courrier.
OBJECTIF=Une phrase « Merci de confirmer l'absence d'évolutivité ... » ; y glisser le contexte tensionnel et le traitement (« chez une patiente hypertendue parfaitement équilibrée par ... ») s'ils figurent dans le courrier.

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
