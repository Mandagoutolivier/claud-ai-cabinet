; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Cles informatives NON lues par le logiciel : DESTINATION_MODE, REGROUPEMENT, [REVISION_FINALE], FORME, UNE_PHRASE_PAR_LIGNE, MEDICAMENTS, TELEGRAPHIQUE_TRAITEMENT
; Profil etabli sur 5 lettres reelles du medecin (angioscanner coronaire, CCN).

[IDENTITE]
CODE=COROSCANNER
LIBELLE=coroscanner
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=COROSCANNER
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.
; {MOTIF} est une proposition relative qui enchaine directement : "qui a présenté ...", "qui a bénéficié en 2023 d'une angioplastie ...", "qui présente ...", "aux antécédents d'angioplastie de l'IVA en 2011 ...".

[MOTIF]
DEFAUT=
FORME=RELATIVE
EXEMPLES=qui a présenté à 15 jours d'intervalle des douleurs rétrosternales ascendantes à l'effort;qui a bénéficié en 2023 d'une angioplastie circonflexe sur une séquelle inférieure;qui présente des troubles du rythme supraventriculaire;aux antécédents d'angioplastie de l'IVA en 2011 avec un contrôle coronarographique normal en 2020

[STRUCTURE]
ORDRE=SYMPTOMES;FACTEURS_RISQUE;EXAMEN_ET_ECG;EXAMENS_ANTERIEURS;OBJECTIF;TRAITEMENTS;CONSIGNE_PRATIQUE
OBLIGATOIRE=OBJECTIF
OBLIGATOIRE_SI_PRESENT=SYMPTOMES;EXAMEN_ET_ECG;EXAMENS_ANTERIEURS;TRAITEMENTS
OPTIONNEL=FACTEURS_RISQUE;CONSIGNE_PRATIQUE
INTERDIT=ECHOGRAPHIE;BIOLOGIE_RENALE;CONCLUSION_CONSULTATION;SUIVI

[STYLE]
LONGUEUR=MOYENNE
PARAGRAPHES_MAX=7
UNE_PHRASE_PAR_LIGNE=OUI
TELEGRAPHIQUE_TRAITEMENT=OUI

[OBJECTIF]
MODELE=Merci de vérifier l'absence de coronaropathie.
VARIANTES=Merci d'exclure une évolutivité angineuse ou une resténose.;Merci de faire la part d'une évolutivité coronarienne.;Merci de vérifier l'absence de coronaropathie.
; Choisir la variante selon le contexte : patient sans antecedent coronarien = "vérifier l'absence de coronaropathie" ; stent/angioplastie = "exclure une évolutivité angineuse ou une resténose" ; pontage ou ischémie scintigraphique = "faire la part d'une évolutivité coronarienne".

[PREFIXES]
FACTEURS_RISQUE=
EXAMEN_ET_ECG=L'examen et l'électrocardiogramme
EXAMENS_ANTERIEURS=
TRAITEMENTS=Traitement habituel
CONSIGNE_PRATIQUE=Je lui demande de

[SELECTION]
SYMPTOMES=douleur thoracique;douleurs retrosternales;angor;asymptomatique;effort;oppression;dyspnee;atypique
FACTEURS_RISQUE=hypertension arterielle;diabete;dyslipidemie;tabagisme;antecedents familiaux;facteur de risque
EXAMEN_ET_ECG=examen;electrocardiogramme;ecg;normal;axe;repolarisation;ischemie sous epicardique;bloc;non contributif
EXAMENS_ANTERIEURS=scintigraphie;scintigramme;test d effort;coronarographie;score calcique;hypoperfusion;ischemie;faux positif
TRAITEMENTS=traitement;kardegic;betabloquant;statine;antiagregant;anticoagulant;metformine;glucophage
CONSIGNE_PRATIQUE=glucophage;metformine;stopper;48 heures;allergie;iode

[INSTRUCTIONS]
SYMPTOMES=Une a deux lignes sur les symptomes ou leur absence, avec les circonstances (effort, sport) ; formulations du medecin : "Il reste asymptomatique.", "Il n'a pas véritablement d'angor résiduel mais ...", "Il est symptomatique pour des douleurs compatibles avec de l'angor pour les efforts importants." Sans interlocuteur direct.
FACTEURS_RISQUE=Une seule ligne, uniquement si le courrier les mentionne ; le plus souvent "Elle n'a pas de facteur de risque cardiovasculaire." Ne pas enumerer si absent.
EXAMEN_ET_ECG=Une seule phrase reunissant examen clinique et ECG : "L'examen et l'électrocardiogramme sont normaux hormis ..." ou "... ne sont pas contributifs". Si anomalie ECG nouvelle, la decrire precisement (territoire, comparaison aux traces anterieurs).
EXAMENS_ANTERIEURS=Reprendre le resultat de la scintigraphie, du test d'effort ou de la coronarographie quand il justifie le coroscanner (ischemie limitee, faux positif possible, controle anterieur normal). Une ou deux lignes, avec la date si connue.
OBJECTIF=Une phrase directe commencant par "Merci de" : verifier l'absence de coronaropathie, exclure une evolutivite ou une restenose, faire la part d'une evolutivite coronarienne. Eventuellement une phrase de justification ("L'aspect assez localisé ... m'incite à limiter les explorations par un coroscanner").
TRAITEMENTS=Liste telegraphique des noms de medicaments en MAJUSCULES sans virgules, precedee de "Traitement habituel" ou "Traitement actuel :". Omettre si aucun traitement dans le courrier.
CONSIGNE_PRATIQUE=Seulement si pertinent : arret de la metformine (GLUCOPHAGE) 48 heures avant l'examen, remarque sur un diagnostic differentiel (reflux). Une ligne.

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI

[MODALITES]
coroscanner=un coroscanner
avec score calcique=un coroscanner avec score calcique
score calcique seul=un score calcique
