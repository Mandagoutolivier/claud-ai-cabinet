; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Profil etabli sur les lettres reellement ecrites (2 lettres, radiologue ami) : demande + lesion connue en une phrase, un element d'examen vasculaire, puis "Merci de vérifier l'absence d'évolutivité".

[IDENTITE]
CODE=ECHODOPPLER_ARTERIEL_MEMBRES_INFERIEURS
LIBELLE=échodoppler artériel des membres inférieurs
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=ECHODOPPLER_ARTERIEL,ECHODOPPLER_MEMBRES_INFERIEURS
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, qui présente {MOTIF}.
MODELE_RENOUVELLEMENT=Merci de renouveler l'{EXAMEN} de {PATIENT}{AGE_SEGMENT} qui présente {MOTIF}.

[MOTIF]
DEFAUT=une artériopathie des membres inférieurs à surveiller
EXEMPLES=un petit anévrisme de l'aorte abdominale terminale de l'ordre de 30 mm sur les examens réalisés l'année dernière;une artérite distale diabétique avec un pouls tibial postérieur droit seul perçu en distalité

[STRUCTURE]
ORDRE=EXAMEN_VASCULAIRE;OBJECTIF
OBLIGATOIRE=OBJECTIF
OBLIGATOIRE_SI_PRESENT=EXAMEN_VASCULAIRE
OPTIONNEL=
INTERDIT=ANAMNESE;TRAITEMENTS;BIOLOGIE_RENALE;GESTES_ANTERIEURS;ECG;ECHOGRAPHIE;CONCLUSION

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=3
UNE_PHRASE_PAR_LIGNE=OUI

[OBJECTIF]
MODELE=Merci de vérifier l'absence d'évolutivité.
VARIANTES=Merci de vérifier l'absence d'évolutivité et notamment d'anévrisme poplité.;Merci de vérifier l'absence d'évolutivité et notamment de lésion critique.

[PREFIXES]
EXAMEN_VASCULAIRE=Les pouls

[SELECTION]
MOTIF=anevrisme;aorte abdominale;arterite;arteriopathie;stenose;occlusion;athérome;diabetique;pouls;examens realises
EXAMEN_VASCULAIRE=pouls;poplite;tibial;pedieux;femoral;asymetrique;ample;percu;distalite;souffle

[INSTRUCTIONS]
MOTIF=Lesion vasculaire connue justifiant la surveillance, reprise du courrier principal en une proposition relative commencant par "qui présente", avec la date ou l'anciennete des examens anterieurs si elle figure dans le courrier.
EXAMEN_VASCULAIRE=Une seule phrase sur les pouls ou l'examen vasculaire du courrier principal (asymetrie, pouls perçu ou aboli, pouls ample), uniquement si le courrier en fait etat ; sinon omettre. Sans duplication du motif et sans interlocuteur direct.
OBJECTIF=Reprendre le MODELE ; ajouter "et notamment de ..." uniquement si le courrier principal designe une lesion precise a rechercher (anevrisme poplite, stenose...).

[MODALITES]
Membres inférieurs=un échodoppler artériel des membres inférieurs
Membres inférieurs et aorte abdominale=un échodoppler artériel des membres inférieurs et de l'aorte abdominale
Renouvellement=renouveler l'échodoppler artériel des membres inférieurs

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
