; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Cles informatives NON lues par le logiciel : DESTINATION_MODE, REGROUPEMENT, [REVISION_FINALE], FORME, UNE_PHRASE_PAR_LIGNE, MEDICAMENTS, TELEGRAPHIQUE_TRAITEMENT
; Profil ajuste sur 8 lettres reelles du medecin : 2-3 lignes, contexte vasculaire dans la premiere phrase, objectif = "Merci de verifier l'absence d'evolutivite".

[IDENTITE]
CODE=ECHODOPPLER_TSA
LIBELLE=échodoppler des troncs supra-aortiques
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=ECHODOPPLER_VAISSEAUX_DU_COU
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.

[MOTIF]
DEFAUT=
; Le motif est une apposition qui suit directement le nom du patient : "qui présente des lésions bicarotidiennes à 65 % NASCET", "aux antécédents d'endartériectomie carotidienne gauche en 2000", "qui a présenté en 2011 une dissection carotidienne droite sans séquelle neurologique significative", "ayant bénéficié d'une endartériectomie carotidienne interne gauche en 2014 avec des suites simples". Si l'examen est un suivi, l'examen devient "un échodoppler des troncs supra-aortiques de contrôle".

[STRUCTURE]
ORDRE=EXAMEN_VASCULAIRE;DOPPLER_ANTERIEUR;OBJECTIF
OBLIGATOIRE=
OBLIGATOIRE_SI_PRESENT=EXAMEN_VASCULAIRE;DOPPLER_ANTERIEUR
OPTIONNEL=OBJECTIF
INTERDIT=ECG;TRAITEMENTS;FACTEURS_RISQUE;ECHOCARDIOGRAPHIE;SYMPTOMES_CARDIAQUES

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=4

[OBJECTIF]
MODELE=Merci de vérifier l'absence d'évolutivité.
; Variantes reelles selon le contexte : "Merci de contrôler l'absence d'évolutivité." ; "Merci de confirmer l'absence d'évolutivité du côté gauche." ; "Merci de confirmer l'absence de lésion critique sur les troncs supra-aortiques." ; "Merci de vérifier l'absence de dissection évolutive ou de lésion chronique." Omettre si la premiere phrase suffit.

[PREFIXES]
EXAMEN_VASCULAIRE=L'examen vasculaire périphérique est
DOPPLER_ANTERIEUR=

[SELECTION]
EXAMEN_VASCULAIRE=souffle carotidien;souffle cervical;pouls distaux;examen vasculaire periferique;examen vasculaire
DOPPLER_ANTERIEUR=echodoppler;echo-doppler;stenose;lesion bicarotidienne;carotide interne;occlusion;dissection;asymetrie des flux;nascet;ecst;evolutivite;endarteriectomie;stent carotidien

[INSTRUCTIONS]
EXAMEN_VASCULAIRE=Une seule phrase reprenant l'examen vasculaire du courrier principal : "L'examen vasculaire périphérique est normal." ou "On retrouve toujours un petit souffle carotidien gauche." Sans duplication de la premiere phrase, sans interlocuteur direct.
DOPPLER_ANTERIEUR=Une seule phrase sur le precedent echodoppler ou l'evolutivite, uniquement si elle n'est pas deja dans la premiere phrase : "Il persiste une asymétrie des flux à 35 cm/s à droite contre 80 cm/s à gauche.", "À gauche, il n'y a pas de lésion significative.", "Il n'y a pas d'évolutivité vasculaire depuis cette date." Conserver pourcentages, methode (ECST/NASCET), cotes et dates tels quels.
OBJECTIF=Une phrase commencant par "Merci de" (vérifier, confirmer, contrôler) et disant ce que l'examen doit etablir : absence d'évolutivité, absence de lésion critique, absence de dissection évolutive. Pas de "Cet examen permettra", pas de "Je te tiens informé".

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI
