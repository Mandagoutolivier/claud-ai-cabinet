; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; Calibre sur les lettres de demande reellement ecrites par le medecin (corpus sept. 2026).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT}{AGE_SEGMENT} {MOTIF} ; {MODALITE} ou {DEGRE_URGENCE} = texte de la modalite choisie ;
;   {TERRAIN} {PRONOM_OBJET} {SPECIALITE} {VALEUR} sont remplis par l'API d'apres le courrier
; [STRUCTURE] ORDRE : rubriques du corps dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (1-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [OBJECTIF] MODELE : derniere phrase de la lettre ("Merci de confirmer l'absence de ...") ; VARIANTES separees par ;
; [MODALITES] libelle=texte : propose au medecin par Ctrl+Alt+D ; un texte commencant par "Merci" remplace toute la premiere phrase
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)
; Cles informatives NON lues par le logiciel : DESTINATION_MODE, REGROUPEMENT, [REVISION_FINALE], FORME, UNE_PHRASE_PAR_LIGNE, MEDICAMENTS, TELEGRAPHIQUE_TRAITEMENT
; Profil aligne sur les lettres reelles du medecin (3 demandes de scintigraphie du corpus) :
; une phrase par ligne, 4 a 7 lignes, antecedent ou terrain accole au patient dans la premiere phrase,
; examen et ECG en une seule ligne, objectif = "Merci de confirmer l'absence de ...".

[IDENTITE]
CODE=SCINTIGRAPHIE_MYOCARDIQUE
LIBELLE=scintigraphie myocardique d'effort
ARTICLE=une
NATURE=EXAMEN
TYPE_BASE=SCINTIGRAPHIE_MYOCARDIQUE
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.
; {MOTIF} est accole au patient apres une virgule : antecedent, terrain ou motif direct.
; Exemples reels : ", aux antécédents d'angioplastie IVA – diagonale en 2023" ;
; " qui présente un score calcique intermédiaire à 188 avec des calcifications siégeant essentiellement sur l'IVA proximale" ;
; ", hypertendu, présentant une spondylarthrite ankylosante".
; La consigne d'arret d'un betabloquant peut etre integree a la demande : "48 heures après l'arrêt du LOGIMAX".

[MOTIF]
DEFAUT=
; Pas de motif par defaut : si aucun antecedent, terrain ni motif n'est disponible, la premiere phrase s'arrete apres le patient.

[STRUCTURE]
ORDRE=MOTIF;INTERPRETATION;TRAITEMENT;CONSIGNE_ARRET;EXAMEN_ET_ECG;OBJECTIF
OBLIGATOIRE=MOTIF;EXAMEN_ET_ECG
OBLIGATOIRE_SI_PRESENT=TRAITEMENT;CONSIGNE_ARRET
OPTIONNEL=INTERPRETATION;OBJECTIF
INTERDIT=ECHOGRAPHIE;ANTECEDENTS_DETAILLES;FACTEURS_RISQUE;BIOLOGIE;CONCLUSION_DU_COMPTE_RENDU

[STYLE]
LONGUEUR=MOYENNE
PARAGRAPHES_MAX=7
; Une phrase par ligne. Phrases courtes et directes. Pas de "Je te serais reconnaissant", pas de "et de m'adresser le compte rendu",
; pas de "Au total", pas de "Je te tiens informé". Molecules du traitement en MAJUSCULES, separees par des espaces, sans virgules.

[OBJECTIF]
MODELE=Merci de confirmer l'absence d'ischémie myocardique.
; Variante si terrain coronarien connu ou score calcique eleve : "Merci de confirmer l'absence de coronaropathie évolutive."
; Variante si test d'effort douteux : "Mais vu le terrain coronarien connu, merci de le confirmer par une scintigraphie myocardique d'effort."
; Omettre l'objectif si la question est deja formulee dans le corps.

[PREFIXES]
TRAITEMENT=Traitement habituel :
CONSIGNE_ARRET=Il stoppera le
EXAMEN_ET_ECG=Examen et électrocardiogrammes
OBJECTIF=Merci de confirmer l'absence de

[SELECTION]
MOTIF=test d effort;sous decalage;douteux;faux positif;recuperation;score calcique;calcifications;iva;asymptomatique;angineux;douleur thoracique;dyspnee;effort;de principe
INTERPRETATION=sans doute;faux positif;vu le terrain;probable;douteux
TRAITEMENT=traitement habituel;betabloquant;bisoprolol;kardegic;aspirine;statine;pas de traitement;a visee cardiaque
CONSIGNE_ARRET=stoppera;arret;48 heures;avant l examen;betabloquant;bisoprolol;logimax;nebivolol;atenolol
EXAMEN_ET_ECG=examen;electrocardiogramme;ecg;normal;normaux;hormis;en dehors de;souffle;bloc;hemibloc;barlow;repolarisation
OBJECTIF=ischemie;coronaropathie;confirmer;absence

[INSTRUCTIONS]
MOTIF=Une ou deux lignes : le resultat qui motive la demande (test d'effort douteux avec sa description, score calcique chiffre et siege des calcifications, ou symptomes / "Il est asymptomatique sur le plan angineux."). Une phrase par ligne, sans interlocuteur direct, sans duplication de la premiere phrase.
INTERPRETATION=Facultatif, une ligne, seulement si le courrier principal exprime une interpretation ("Il s'agit sans doute d'un faux positif vu la récupération très rapide."). Ne rien inventer.
TRAITEMENT=Une ligne "Traitement habituel : MOLECULE DOSE MOLECULE DOSE ..." en majuscules sans virgules, ou "Il n'a pas de traitement à visée cardiaque." si le courrier le precise. Omettre si inconnu.
CONSIGNE_ARRET=Une ligne, uniquement si un betabloquant ou un bradycardisant figure au traitement : "Il stoppera le BISOPROLOL 48 heures avant l'examen." Ne pas repeter si deja integree a la premiere phrase.
EXAMEN_ET_ECG=Une seule ligne fusionnant examen clinique et ECG : "Examen et électrocardiogrammes normaux." ou "L'examen et l'électrocardiogramme sont normaux." ; ajouter la particularite avec "hormis" / "en dehors de" (souffle, hemibloc, Barlow). Ne pas separer en deux rubriques.
OBJECTIF=Une ligne "Merci de confirmer l'absence d'ischémie myocardique." ou "... de coronaropathie évolutive." Omettre si une phrase equivalente existe deja dans le corps.

[REVISION_FINALE]
APPEL_API=OUI
NIVEAU=LEGER
CONSERVER_PARAGRAPHES=OUI
CONTROLE_NUMERIQUE=OUI

[MODALITES]
d'effort=une scintigraphie myocardique d'effort
d'effort de principe=une scintigraphie myocardique d'effort de principe
couplée RAPISCAN si nécessaire=une scintigraphie myocardique d'effort, si nécessaire couplée au RAPISCAN
sous RAPISCAN=une scintigraphie myocardique sous RAPISCAN
d'effort après arrêt du bêtabloquant=une scintigraphie myocardique d'effort, 48 heures après l'arrêt du bêtabloquant
