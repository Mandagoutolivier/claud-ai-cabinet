; Profil de demande d'examen ou d'avis : modifiable au Bloc-notes (UTF-8).
; [PREMIER_PARAGRAPHE] MODELE : {ARTICLE_EXAMEN} {PATIENT} {AGE_SEGMENT} {EXAMEN} {MOTIF}
; [STRUCTURE] ORDRE : rubriques du corps, dans l'ordre ; OBLIGATOIRE / OBLIGATOIRE_SI_PRESENT / OPTIONNEL / INTERDIT
; [STYLE] LONGUEUR : COURTE (2-3 lignes), MOYENNE (4-6), DETAILLEE (jusqu'a 10)
; [PREFIXES] : debut de phrase impose pour une rubrique ; [SELECTION] : mots-cles guidant l'extraction
; [MODALITES] (facultatif) : libelle=texte de l'examen, propose au medecin par Ctrl+Alt+D
; TYPE_BASE : code(s) TypeExamen du classeur des specialistes (destinataire pre-rempli)

[IDENTITE]
CODE=SCORE_CALCIQUE
LIBELLE=score calcique coronaire
ARTICLE=un
NATURE=EXAMEN
TYPE_BASE=SCORE_CALCIQUE
DESTINATION_MODE=BASE
REGROUPEMENT=MEME_PROFIL

[PREMIER_PARAGRAPHE]
MODELE=Merci de réaliser {ARTICLE_EXAMEN} à {PATIENT}{AGE_SEGMENT}, {MOTIF}.

[MOTIF]
DEFAUT=dans le contexte exposé ci-dessous

[STRUCTURE]
ORDRE=FACTEURS_RISQUE;ANTECEDENTS_CORONARIENS;BIOLOGIE_LIPIDIQUE;OBJECTIF
OBLIGATOIRE=FACTEURS_RISQUE
OBLIGATOIRE_SI_PRESENT=
OPTIONNEL=ANTECEDENTS_CORONARIENS;BIOLOGIE_LIPIDIQUE
INTERDIT=EXAMEN_CLINIQUE;ECG;ECHOGRAPHIE;HOLTER;MAPA;BIOLOGIE_GENERALE

[STYLE]
LONGUEUR=COURTE
PARAGRAPHES_MAX=3

[OBJECTIF]
MODELE=Cet examen permettra de préciser le niveau de risque coronaire et d'adapter la stratégie préventive.

[PREFIXES]
FACTEURS_RISQUE=Les facteurs de risque cardiovasculaire comprennent
ANTECEDENTS_CORONARIENS=Les antécédents coronariens comprennent
BIOLOGIE_LIPIDIQUE=Le bilan lipidique montre

[SELECTION]
FACTEURS_RISQUE=hypertension arterielle;diabete;dyslipidemie;tabagisme;antecedents familiaux;obesite;surpoids;insuffisance renale;age;sedentarite
ANTECEDENTS_CORONARIENS=coronaropathie;angioplastie;stent;pontage;infarctus;syndrome coronaire;atherome coronaire
BIOLOGIE_LIPIDIQUE=cholesterol;ldl;hdl;triglycerides;apolipoproteine;lipoproteine(a)

[INSTRUCTIONS]
