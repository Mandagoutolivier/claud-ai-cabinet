[INSTRUCTIONS]
CONTEXTE=Une seule phrase accrochée à l'identité : terrain (hypertendu, asymptomatique), puis le diagnostic et l'examen qui l'a établi (« sur les données IRM avec une hypertrophie essentiellement septale non obstructive »). Mentionner les antécédents familiaux s'ils figurent dans le courrier principal.
TRAITEMENTS=Une ligne : « Son traitement associe A – B – C. », médicaments en majuscules, sans posologie.
QUESTION=Dernière ligne : « Merci de faire une analyse génétique de cette cardiopathie. » ou « Merci d'organiser l'enquête familiale. » selon le courrier principal.

